<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#0f172a;overflow:hidden}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" font-size="54" font-weight="700" fill="#f8fafc">Orchestrator–Workers</text>
  <text x="600" y="148" text-anchor="middle" font-size="24" fill="#94a3b8">One LLM plans the work, other LLM calls do it, built from scratch with the Claude API</text>

  <!-- Task -->
  <rect x="300" y="195" width="600" height="64" rx="32" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="600" y="236" text-anchor="middle" font-size="24" fill="#e2e8f0">Task: “Write a congratulations message”</text>
  <line x1="600" y1="259" x2="600" y2="303" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>

  <!-- Orchestrator -->
  <rect x="330" y="305" width="540" height="120" rx="18" fill="#1e293b" stroke="#d97757" stroke-width="3"/>
  <text x="600" y="352" text-anchor="middle" font-size="32" font-weight="700" fill="#f8fafc">Orchestrator</text>
  <text x="600" y="390" text-anchor="middle" font-size="21" fill="#cbd5e1">Claude decides HOW to split the task</text>
  <line x1="600" y1="425" x2="600" y2="463" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>

  <!-- Parse -->
  <rect x="250" y="465" width="700" height="110" rx="18" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <text x="600" y="508" text-anchor="middle" font-size="28" font-weight="700" fill="#f8fafc">Parse the XML plan in code</text>
  <text x="600" y="548" text-anchor="middle" font-size="21" fill="#fbbf24" font-family="Consolas, monospace">&lt;tasks&gt; → every &lt;task&gt; → {type, description}</text>

  <!-- Fan out -->
  <path d="M600,575 V610 H230 V646" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <path d="M600,610 V646" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <path d="M600,610 H970 V646" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <text x="612" y="602" font-size="19" fill="#94a3b8">run in parallel</text>

  <!-- Workers -->
  <rect x="80" y="648" width="300" height="150" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="230" y="690" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">Worker 1</text>
  <text x="230" y="722" text-anchor="middle" font-size="19" fill="#a78bfa">Claude</text>
  <text x="230" y="766" text-anchor="middle" font-size="22" fill="#e2e8f0">Warm &amp; heartfelt</text>

  <rect x="450" y="648" width="300" height="150" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="600" y="690" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">Worker 2</text>
  <text x="600" y="722" text-anchor="middle" font-size="19" fill="#a78bfa">Claude</text>
  <text x="600" y="766" text-anchor="middle" font-size="22" fill="#e2e8f0">Humorous &amp; playful</text>

  <rect x="820" y="648" width="300" height="150" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="970" y="690" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">Worker 3</text>
  <text x="970" y="722" text-anchor="middle" font-size="19" fill="#a78bfa">Claude</text>
  <text x="970" y="766" text-anchor="middle" font-size="22" fill="#e2e8f0">Short &amp; punchy</text>

  <!-- Fan in -->
  <path d="M230,798 V838 H600 V874" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <path d="M600,798 V874" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="M970,798 V838 H600" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <!-- Results -->
  <rect x="350" y="876" width="500" height="80" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
  <text x="600" y="926" text-anchor="middle" font-size="27" font-weight="700" fill="#f8fafc">3 versions, side by side</text>

  <!-- Lesson -->
  <text x="600" y="1030" text-anchor="middle" font-size="23" fill="#cbd5e1">Lesson: the plan is only useful if you can parse it.</text>
  <text x="600" y="1066" text-anchor="middle" font-size="23" fill="#cbd5e1">Show the model the exact format, then parse every block, not just the first.</text>
  <text x="600" y="1150" text-anchor="middle" font-size="20" fill="#64748b">github.com/youhana-sobhy/agentic-patterns-lab</text>
</svg>
</body></html>
